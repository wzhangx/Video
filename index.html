<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频展示</title>
  <style>
    body {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
      text-align: center;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>视频展示</h1>

  <video controls playsinline preload="metadata">
    <source src="./Lab tour.mp4" type="video/mp4">
    您的浏览器不支持视频播放。
  </video>

  <p><a href="./Lab tour.mp4">打开视频文件</a></p>
</body>
</html>
